name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-scholar.yml'
      - 'google_scholar_crawler/**'

permissions:
  contents: write

concurrency:
  group: google-scholar-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Scholar client
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Test citation processing without network
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py' -v

      - name: Check out published stats branch
        run: |
          git fetch origin refs/heads/google-scholar-stats:refs/remotes/origin/google-scholar-stats
          git worktree add /tmp/gs-stats origin/google-scholar-stats

      - name: Fetch Google Scholar citations
        env:
          GOOGLE_SCHOLAR_ID: wtcf_r4AAAAJ
        run: python google_scholar_crawler/main.py --output-dir /tmp/gs-stats

      - name: Publish validated citation data
        run: |
          cd /tmp/gs-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "Citation data unchanged"
          else
            git commit -m "data: refresh validated Google Scholar citations"
            git push origin HEAD:google-scholar-stats
          fi
