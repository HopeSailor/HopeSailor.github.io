name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        working-directory: ./google_scholar_crawler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch Google Scholar data
        working-directory: ./google_scholar_crawler
        timeout-minutes: 4
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting Google Scholar crawler..."

          if timeout 180s python -u main.py; then
            echo "Google Scholar crawler completed successfully."
          else
            status=$?

            if [ "$status" -eq 124 ]; then
              echo "::error::Google Scholar crawler timed out after 180 seconds."
              exit 1
            fi

            echo "::error::Google Scholar crawler failed with exit code $status."
            exit "$status"
          fi

      - name: Publish citation data
        working-directory: ./google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git add *.json
          git commit -m "Updated Citation Data"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:google-scholar-stats --force
